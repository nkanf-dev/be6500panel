[package]
name = "be6500-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Bounded, loopback-only embedded panel diagnostic foundation"

[lib]
name = "be6500_panel"

[[bin]]
name = "be6500-panel"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
subtle = { version = "2.6", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
