[package]
name = "be6500-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Bounded, loopback-only embedded panel diagnostic foundation"

[lib]
name = "be6500_panel"

[[bin]]
name = "be6500-panel"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
