name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.build/rust
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
          targets: armv7-unknown-linux-musleabihf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: ARMv7 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - run: make setup
      - run: make test
      - run: make build armv7
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-ar
      - run: cd web && bunx playwright install --with-deps chromium
      - run: cd web && bun run test:browser
