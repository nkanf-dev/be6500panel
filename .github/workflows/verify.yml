name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make setup
      - run: make test
      - run: go test -race ./...
      - run: make build armv7
      - run: cd web && bunx playwright install --with-deps chromium
      - run: cd web && bun run test:browser
