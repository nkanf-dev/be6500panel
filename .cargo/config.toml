# One rebuildable output tree. Agent worktrees must share CARGO_TARGET_DIR
# with the integration worktree rather than creating another target directory.
[build]
target-dir = ".build/rust"
jobs = 1
incremental = false

# Native fork/check/lock fault fixtures must not overlap across test cases.
[env]
RUST_TEST_THREADS = { value = "1", force = true }
